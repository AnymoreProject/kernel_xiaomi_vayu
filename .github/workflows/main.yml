name: Build NoMount Module
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NoMount Source Safely
        run: |
          mkdir -p fs/nomount
          # استخدام مستودع NoMount الرسمي الموثوق لتجنب أي مشاكل تسجيل دخول
          git -c credential.helper='' clone --depth=1 https://github.com/chiteroman/NoMount.git temp_nomount || \
          curl -L -o nomount.zip https://github.com/chiteroman/NoMount/archive/refs/heads/main.zip && unzip -q nomount.zip && mv NoMount-* temp_nomount || true
          
          if [ -d "temp_nomount/kernel/fs/nomount" ]; then
            cp -r temp_nomount/kernel/fs/nomount/* fs/nomount/
          elif [ -d "temp_nomount/fs/nomount" ]; then
            cp -r temp_nomount/fs/nomount/* fs/nomount/
          elif [ -d "temp_nomount" ]; then
            cp -r temp_nomount/* fs/nomount/ 2>/dev/null || true
          fi
          rm -rf temp_nomount nomount.zip

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git unzip

      - name: Compile nomount.ko
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out vayu_defconfig
          make O=out -j$(nproc) modules_prepare
          make O=out -j$(nproc) CONFIG_NOMOUNT=m M=fs/nomount

      - name: Upload nomount.ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomount-ko-vayu
          path: |
            out/fs/nomount/nomount.ko
            fs/nomount/nomount.ko
