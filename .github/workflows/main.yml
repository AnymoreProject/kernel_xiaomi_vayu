name: Build NoMount Module
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NoMount via Codeload
        run: |
          mkdir -p fs/nomount
          curl -L -o nomount.zip https://codeload.github.com/nomount/kernel/zip/refs/heads/main || curl -L -o nomount.zip https://codeload.github.com/nomount/kernel/zip/refs/heads/master
          unzip -q nomount.zip
          cp -r kernel-*/kernel/fs/nomount/* fs/nomount/ 2>/dev/null || cp -r kernel-*/fs/nomount/* fs/nomount/ 2>/dev/null || true
          rm -rf nomount.zip kernel-*

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git unzip

      - name: Compile nomount.ko
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out vayu_defconfig
          make O=out -j$(nproc) modules_prepare
          make O=out -j$(nproc) CONFIG_NOMOUNT=m M=fs/nomount

      - name: Upload nomount.ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomount-ko-vayu
          path: |
            out/fs/nomount/nomount.ko
            fs/nomount/nomount.ko
