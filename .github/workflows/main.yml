name: Build NoMount Module
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download NoMount Files Robustly
        run: |
          mkdir -p fs/nomount
          export GIT_TERMINAL_PROMPT=0
          
          # محاولة سحب المجلد من المستودعات الرسمية أو الاحتياطية تلقائياً
          git clone --depth=1 https://github.com/nomount/kernel.git temp_nomount || \
          git clone --depth=1 https://github.com/nomount/NoMount.git temp_nomount || \
          git clone --depth=1 https://github.com/chiteroman/NoMount.git temp_nomount || true
          
          if [ -d "temp_nomount/kernel/fs/nomount" ]; then
            cp -r temp_nomount/kernel/fs/nomount/* fs/nomount/
          elif [ -d "temp_nomount/fs/nomount" ]; then
            cp -r temp_nomount/fs/nomount/* fs/nomount/
          elif [ -d "temp_nomount" ] && [ -f "temp_nomount/Kconfig" ]; then
            cp -r temp_nomount/* fs/nomount/
          else
            echo "Error: Failed to clone NoMount repository or locate source files."
            exit 1
          fi
          rm -rf temp_nomount

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git

      - name: Compile nomount.ko
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out vayu_defconfig
          make O=out -j$(nproc) modules_prepare
          make O=out -j$(nproc) CONFIG_NOMOUNT=m M=fs/nomount

      - name: Upload nomount.ko Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomount-ko-vayu
          path: |
            out/fs/nomount/nomount.ko
            fs/nomount/nomount.ko
