name: Build NoMount Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git

      - name: Compile NoMount Module
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          # إعداد النواة وتجميع الموديول الخارجي
          make O=out vayu_defconfig
          make O=out -j$(nproc) modules_prepare
          make O=out -j$(nproc) CONFIG_NOMOUNT=m M=fs/nomount
